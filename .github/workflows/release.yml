name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stable: ${{ steps.meta.outputs.stable }}
    steps:
      - name: Extract version metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: [init]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify crate version matches tag
        env:
          TAG_VERSION: ${{ needs.init.outputs.version }}
        run: |
          CRATE_VERSION=$(grep '^version =' rust/trustify-client/Cargo.toml | head -1 | cut -d '"' -f 2)
          if [ "${CRATE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match Cargo.toml (${CRATE_VERSION})"
            exit 1
          fi
      - name: Run tests
        working-directory: rust
        run: cargo test --workspace --all-features
      - name: Dry-run publish
        run: cargo publish --manifest-path rust/trustify-client/Cargo.toml --dry-run

  publish:
    needs: [init, check]
    if: needs.init.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish trustify-client to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path rust/trustify-client/Cargo.toml
